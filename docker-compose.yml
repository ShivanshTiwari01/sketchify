services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sketchify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d sketchify']
      interval: 5s
      timeout: 5s
      retries: 5

  http-backend:
    build:
      context: .
      dockerfile: apps/http-backend/Dockerfile
    restart: unless-stopped
    env_file: ./apps/http-backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  ws-backend:
    build:
      context: .
      dockerfile: apps/ws-backend/Dockerfile
    restart: unless-stopped
    env_file: ./apps/ws-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      http-backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_HTTP_URL: ${NEXT_PUBLIC_HTTP_URL:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
    restart: unless-stopped
    env_file: ./apps/frontend/.env
    depends_on:
      - http-backend
      - ws-backend

volumes:
  postgres_data:
